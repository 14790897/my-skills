<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#0a0a0a; color:#e0e0e0; min-height:100vh; }
    .container { max-width:720px; margin:0 auto; padding:48px 24px; }
    h1 { font-size:1.5rem; font-weight:600; margin-bottom:4px; }
    .sub { color:#888; font-size:0.9rem; margin-bottom:24px; }
    .search-wrap { position:relative; margin-bottom:32px; }
    #search { width:100%; padding:12px 16px 12px 40px; background:#111; border:1px solid #222; border-radius:8px; color:#e0e0e0; font-size:0.95rem; outline:none; transition:border-color 0.2s; }
    #search:focus { border-color:#444; }
    #search::placeholder { color:#555; }
    .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#555; font-size:1rem; pointer-events:none; }
    .skill { border:1px solid #1a1a1a; border-radius:8px; padding:20px; margin-bottom:12px; transition:border-color 0.2s; }
    .skill:hover { border-color:#333; }
    .skill-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
    .skill-name { font-size:1.1rem; font-weight:600; color:#fff; font-family:'SF Mono','Fira Code',monospace; }
    .skill-link { font-size:0.75rem; color:#555; text-decoration:none; font-family:monospace; transition:color 0.2s; }
    .skill-link:hover { color:#999; }
    .skill-desc { color:#888; font-size:0.9rem; line-height:1.5; }
    .highlight { color:#e0e0e0; background:#222; border-radius:2px; padding:0 2px; }
    .empty { color:#555; font-size:0.9rem; padding:24px 0; }
    .footer { margin-top:48px; padding-top:24px; border-top:1px solid #1a1a1a; color:#444; font-size:0.8rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    .footer a { color:#555; text-decoration:none; }
    .footer a:hover { color:#888; }
    .api-hint { background:#0d0d0d; border:1px solid #1a1a1a; border-radius:6px; padding:10px 14px; margin-bottom:32px; font-family:monospace; font-size:0.78rem; color:#555; word-break:break-all; }
    .api-hint span { color:#888; }
    @media(max-width:480px) {
      .container { padding:32px 16px; }
      .skill-header { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Skills</h1>
    <p class="sub">WorkBuddy skill registry</p>

    <div class="api-hint">
      <span>AI search:&nbsp;</span>/api/search?q=<span>your+query</span>
    </div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="text" placeholder="Search skills..." autocomplete="off">
    </div>

    <div id="skills"></div>
    <div id="empty" class="empty" style="display:none;">No skills found.</div>

    <div class="footer">
      <a href="/index.json">index.json</a>
      <span>Powered by Vercel</span>
    </div>
  </div>

  <script>
    let allSkills = [];

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function highlightText(text, query) {
      if (!query) return escapeHtml(text);
      const esc = escapeHtml(text);
      const escQuery = escapeHtml(query);
      const re = new RegExp(`(${escQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return esc.replace(re, '<span class="highlight">$1</span>');
    }

    function renderSkills(skills, query) {
      const el = document.getElementById('skills');
      const empty = document.getElementById('empty');
      if (skills.length === 0) {
        el.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      el.innerHTML = skills.map(s => `
        <div class="skill">
          <div class="skill-header">
            <span class="skill-name">${highlightText(s.name, query)}</span>
            <a class="skill-link" href="${s.url}" target="_blank">${s.url}</a>
          </div>
          <p class="skill-desc">${highlightText(s.description, query)}</p>
        </div>
      `).join('');
    }

    // load all skills
    fetch('/index.json').then(r => r.json()).then(skills => {
      allSkills = skills;
      renderSkills(allSkills, '');
    });

    // search via API for better matching (searches full content)
    let debounce = null;
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(debounce);
      const q = e.target.value.trim();
      if (!q) { renderSkills(allSkills, ''); return; }

      debounce = setTimeout(() => {
        const local = allSkills.filter(s =>
          s.name.toLowerCase().includes(q.toLowerCase()) ||
          s.description.toLowerCase().includes(q.toLowerCase())
        );
        renderSkills(local, q);
      }, 150);
    });

    // update API hint
    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      document.querySelector('.api-hint span:last-child').textContent = q ? q : 'your+query';
    });
  </script>
</body>
</html>
